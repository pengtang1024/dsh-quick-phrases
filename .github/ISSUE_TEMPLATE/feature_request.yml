# 功能建议（GitHub Issue Forms）
name: 功能建议（Feature request）
description: 说说你在快捷短语上缺的那一步，以及它应该长什么样。
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        先谢谢你的想法。如果只是在现有设置里调参数，也可以直接提；改动涉及数据格式时会单独说明。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在卡在哪里、这件事多久出现一次、绕过去的代价是什么。
      placeholder: '例如：每天要发同一段很长的提示词，现在按钮文字长了就挤成一行，看不出区别。'
      render: markdown
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案
      description: 你希望看到的具体行为；有界面草图或交互示意更好。
      placeholder: '例如：发送内容支持「变量占位」/ 按钮支持分组收起 / 支持导入导出 JSON。'
      render: markdown
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 现在怎么绕过；或者你考虑过但觉得不合适的做法。
      placeholder: '例如：当前可以把长文本拆成多条短语，但要手动找、效率低。'
      render: markdown
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 这条建议主要改动哪一块？（可多选）
      multiple: true
      options:
        - 短语行（输入框附近的按钮条）
        - 管理页（设置 → 快捷短语）
        - 位置（输入框下方 / 上方 / 工具行）
        - 点按行为（直接发送 / 填入输入框）
        - 其他
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 其它背景、参考实现、相关 issue，或者你愿意自己提 PR 的说明。
      render: markdown
    validations:
      required: false
